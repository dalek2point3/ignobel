<title>Motherhood Penalty Drafts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: two reading columns side by side, a picker above each; stacks on phones */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#1d2430; --muted:#5d6878; --line:#dde2e9;
  --accent:#2f5d8a;
  --c-high:#8a4b14; --c-high-bg:#fbefe3;
  --c-sent:#1f6b52; --c-sent-bg:#e3f4ec;
  --c-orig:#3d4a8f; --c-orig-bg:#e8ebfa;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171d; --panel:#1b2028; --fg:#e4e8ee; --muted:#9aa5b4; --line:#2c333e; --accent:#8db6e0;
  --c-high:#f0b27a; --c-high-bg:#3a2a1c; --c-sent:#7fd3b0; --c-sent-bg:#173329; --c-orig:#a9b4f5; --c-orig-bg:#232a4d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171d; --panel:#1b2028; --fg:#e4e8ee; --muted:#9aa5b4; --line:#2c333e; --accent:#8db6e0;
  --c-high:#f0b27a; --c-high-bg:#3a2a1c; --c-sent:#7fd3b0; --c-sent-bg:#173329; --c-orig:#a9b4f5; --c-orig-bg:#232a4d;
  color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header h1{font-family:var(--serif);font-weight:600;font-size:1.75rem;margin:0 0 4px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:70ch;line-height:1.5}
.cols{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start}
.swap{align-self:start;margin-top:4px;font:500 13px var(--sans);color:var(--accent);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.swap:hover{border-color:var(--accent)}
.swap:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.col{min-width:0;display:grid;gap:12px}
label.pick{display:grid;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
select{font:500 15px var(--sans);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;text-transform:none;letter-spacing:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:grid;gap:14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.chip{font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px}
.chip.high{color:var(--c-high);background:var(--c-high-bg)}
.chip.sent{color:var(--c-sent);background:var(--c-sent-bg)}
.chip.orig{color:var(--c-orig);background:var(--c-orig-bg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-block:1px solid var(--line);padding-block:10px}
.stats div{display:grid;gap:2px}
.stats b{font:400 18px var(--mono);font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.prompt{display:grid;gap:6px}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.prompt pre{white-space:pre-wrap;font:13px/1.55 var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0}
.prompt .none{font-size:13px}
.lbl.out{border-top:1px solid var(--line);padding-top:12px}
h2{font-family:var(--serif);font-weight:600;font-size:1.2rem;margin:0;text-wrap:balance;line-height:1.3}
.text{font-family:var(--serif);font-size:17px;line-height:1.62;display:grid;gap:14px}
.text p{margin:0}
.pn{font:400 11px var(--mono);color:var(--muted);margin-right:6px;user-select:none}
.none{color:var(--muted);font-style:italic}
@media (max-width:760px){.cols{grid-template-columns:1fr}.swap{justify-self:start}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
<div class="wrap">
  <header>
    <h1>Motherhood penalty drafts</h1>
    <p>Pick a piece on each side to read them next to each other. Conditions: high level prompting, sentence by sentence, and the original human-written article.</p>
  </header>
  <div class="cols">
    <div class="col" id="colA"></div>
    <button class="swap" id="swap" type="button" title="Swap sides">⇄ Swap</button>
    <div class="col" id="colB"></div>
  </div>
</div>
<script>
const PIECES = __DATA__;
const cls = c => c.startsWith("high") ? "high" : c.startsWith("sentence") ? "sent" : "orig";
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function stats(t){
  const paras = t.split(/\n\s*\n/).filter(p=>p.trim());
  const words = t.split(/\s+/).filter(Boolean).length;
  const sents = (t.match(/[^.!?]+[.!?]+(?=\s|$)/g)||[]).length || 1;
  return {paras, words, sents, avg:(words/sents).toFixed(1)};
}
function render(side, id){
  const col = document.getElementById("col"+side);
  const opts = PIECES.map(p=>`<option value="${p.piece_id}" ${p.piece_id==id?"selected":""}>${esc(p.condition)} — ${esc(p.author)}</option>`).join("");
  const p = PIECES.find(x=>x.piece_id==id);
  const s = stats(p.text);
  col.innerHTML = `
    <label class="pick" for="sel${side}">Side ${side}<select id="sel${side}">${opts}</select></label>
    <article class="card">
      <div class="meta"><span class="chip ${cls(p.condition)}">${esc(p.condition)}</span><span>${esc(p.author)}</span>${p.model?`<span>· ${esc(p.model)}</span>`:""}</div>
      <div class="stats">
        <div><b>${s.words}</b><span>Words</span></div>
        <div><b>${s.paras.length}</b><span>Paragraphs</span></div>
        <div><b>${s.sents}</b><span>Sentences</span></div>
        <div><b>${s.avg}</b><span>Words / sentence</span></div>
      </div>
      <div class="prompt"><div class="lbl">Prompt</div>${p.prompt?`<pre>${esc(p.prompt)}</pre>`:`<div class="none">No prompt — human-written original</div>`}</div>
      <div class="lbl out">Output</div>
      ${p.title?`<h2>${esc(p.title)}</h2>`:`<h2 class="none">Untitled</h2>`}
      <div class="text">${s.paras.map((t,i)=>`<p><span class="pn">¶${i+1}</span>${esc(t.trim())}</p>`).join("")}</div>
    </article>`;
  document.getElementById("sel"+side).addEventListener("change", e=>{state[side]=e.target.value; render(side,state[side]);});
}
const byCond = c => (PIECES.find(p=>p.condition.startsWith(c))||PIECES[0]).piece_id;
const state = {A: byCond("sentence"), B: byCond("high")};
render("A", state.A); render("B", state.B);
document.getElementById("swap").addEventListener("click", ()=>{[state.A,state.B]=[state.B,state.A]; render("A",state.A); render("B",state.B);});
</script>
